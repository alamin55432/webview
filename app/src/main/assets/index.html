        // পপআপ উইন্ডো রেন্ডার (কোনো ঘোষণা বা বাড়তি লেখা ছাড়া: শুধু ইউজারের দেওয়া ছবি ও বার্তা + ক্রস আইকন, এবং স্ট্যান্ডার্ড সেকেন্ড পর নিজ থেকেই ভ্যানিশ)
        function renderWelcomePopup() {
            if (!state.currentUser || state.currentView !== 'feed') return '';
            const pop = state.popupConfig;
            if (!pop || !pop.active) return '';
            const popId = pop.updatedAt || 'default_popup';
            if (state.popupDismissedId === popId) return '';
            const displayText = [pop.title, pop.text].filter(Boolean).join('\n').trim();
            if (!pop.image && !displayText) return '';
            const durationSec = Math.max(3, Math.min(60, Number(pop.duration) || 8));

            return `
                <div id="welcomePopupOverlay" data-popup-id="${esc(popId)}" data-popup-sec="${durationSec}" class="fixed inset-0 bg-neutral-900/55 backdrop-blur-xs z-[70] flex items-center justify-center p-4">
                    <div class="bg-white border border-neutral-200 rounded-2xl max-w-md w-full overflow-hidden shadow-2xl relative">
                        <button type="button" onclick="dismissWelcomePopup('${esc(popId)}')" aria-label="বন্ধ করুন" class="absolute top-3 right-3 z-10 w-8 h-8 rounded-full bg-white/95 hover:bg-neutral-100 text-neutral-900 border border-neutral-200 flex items-center justify-center shadow-sm transition">
                            <i class="fa-solid fa-xmark text-sm"></i>
                        </button>
                        ${pop.image ? `
                            <div class="w-full max-h-72 bg-neutral-100 overflow-hidden">
                                <img src="${safeUrl(pop.image)}" alt="Popup image" class="w-full max-h-72 object-cover">
                            </div>
                        ` : ''}
                        ${displayText ? `
                            <div class="p-5 ${!pop.image ? 'pt-11' : ''}">
                                <p class="text-sm text-neutral-900 leading-relaxed whitespace-pre-line">${esc(displayText)}</p>
                            </div>
                        ` : ''}
                        <div class="h-1 bg-neutral-100 w-full overflow-hidden">
                            <div class="h-full bg-emerald-600" style="animation: popupShrink ${durationSec}s linear forwards;"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function schedulePopupAutoDismiss() {
            if (popupAutoCloseTimer) {
                clearTimeout(popupAutoCloseTimer);
                popupAutoCloseTimer = null;
            }
            const overlay = document.getElementById('welcomePopupOverlay');
            if (!overlay) return;
            const popId = overlay.getAttribute('data-popup-id');
            const sec = Number(overlay.getAttribute('data-popup-sec')) || 8;
            popupAutoCloseTimer = setTimeout(() => {
                dismissWelcomePopup(popId);
            }, sec * 1000);
        }

        function dismissWelcomePopup(popId) {
            if (popupAutoCloseTimer) {
                clearTimeout(popupAutoCloseTimer);
                popupAutoCloseTimer = null;
            }
            state.popupDismissedId = popId;
            const overlay = document.getElementById('welcomePopupOverlay');
            if (overlay) overlay.remove();
        }

        function previewPopupNow() {
            state.popupDismissedId = null;
            state.currentView = 'feed';
            render();
        }

        async function handleSavePopupConfig(event) {
            event.preventDefault();
            if (!state.currentUser?.isEditor) return;
            const image = document.getElementById('popupImage').value.trim();
            const text = document.getElementById('popupText').value.trim();
            const duration = Math.max(3, Math.min(60, parseInt(document.getElementById('popupDuration').value, 10) || 8));
            const active = document.getElementById('popupActive').checked;

            if (active && !text && !image) {
                showToast('পপআপ চালু করতে ছবি অথবা আপনার বার্তা লিখুন!', true);
                return;
            }

            const payload = {
                title: '',
                image,
                text,
                duration,
                active,
                updatedAt: 'pop_' + Date.now()
            };

            try {
                await db.collection('config').doc('popup').set(payload);
                state.popupConfig = payload;
                state.popupDismissedId = null;
                showToast(active ? 'পপআপ উইন্ডো সেভ ও চালু হয়েছে!' : 'পপআপ উইন্ডো বন্ধ করা হয়েছে।');
                render();
            } catch (e) {
                showToast('পপআপ সেভ করা যায়নি। আবার চেষ্টা করুন।', true);
            }
        }

        function renderPostModal() {
            if (!state.activeModalPostId) return '';
            const post = state.posts.find(p => p.id === state.activeModalPostId);
            if (!post) return '';

            return `
                <div class="fixed inset-0 bg-neutral-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4 overflow-y-auto">
                    <div class="bg-white border border-neutral-200 rounded-2xl max-w-xl w-full max-h-[90vh] overflow-y-auto p-5 relative shadow-xl">
                        <button onclick="closePostModal()" class="absolute top-4 right-4 text-neutral-500 hover:text-neutral-900 w-8 h-8 rounded-full bg-neutral-100 flex items-center justify-center font-bold">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                        <h3 class="text-base font-bold text-neutral-900 mb-3">সম্পূর্ণ পোস্ট</h3>
                        ${renderPostCard(post, true)}
                    </div>
                </div>
            `;
        }

        function renderEditProfileModal() {
            return `
                <div id="editProfileModal" class="fixed inset-0 bg-neutral-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
                    <div class="bg-white border border-neutral-200 rounded-2xl max-w-md w-full p-6 relative shadow-xl">
                        <button onclick="closeEditProfileModal()" class="absolute top-4 right-4 text-neutral-500 hover:text-neutral-900 w-8 h-8 rounded-full bg-neutral-100 flex items-center justify-center font-bold">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                        <h3 class="text-base font-bold text-neutral-900 mb-4">প্রোফাইল এডিট করুন</h3>
                        <form onsubmit="handleUpdateProfile(event)" class="space-y-3">
                            <div>
                                <label class="block text-xs font-semibold text-neutral-700 mb-1">পূর্ণ নাম</label>
                                <input type="text" id="editName" value="${esc(state.currentUser.name)}" required class="w-full p-2.5 rounded-xl border border-neutral-300 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-neutral-700 mb-1">বয়স</label>
                                <input type="number" id="editAge" value="${esc(state.currentUser.age)}" required class="w-full p-2.5 rounded-xl border border-neutral-300 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-neutral-700 mb-1">ঠিকানা</label>
                                <input type="text" id="editLocation" value="${esc(state.currentUser.location)}" required class="w-full p-2.5 rounded-xl border border-neutral-300 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-neutral-700 mb-1">এসএসসি ব্যাচ</label>
                                <input type="text" id="editBatch" value="${esc(state.currentUser.sscBatch)}" required pattern="[0-9]{4}" maxlength="4" class="w-full p-2.5 rounded-xl border border-neutral-300 text-sm">
                            </div>
                            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl font-bold text-sm">সংরক্ষণ করুন</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function switchView(view) {
            state.currentView = view;
            state.activeModalPostId = null;
            state.viewingProfilePhone = null;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ইমেইল ভেরিফিকেশন ছাড়াই সরাসরি সাইনআপ
        async function handleSignup(event) {
            event.preventDefault();
            const btn = document.getElementById('signupSubmitBtn');
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim().toLowerCase();
            const password = document.getElementById('signupPassword').value;
            const rawPhone = document.getElementById('signupPhone').value.trim();
            const profession = document.getElementById('signupProfession').value;
            const age = document.getElementById('signupAge').value;
            const location = document.getElementById('signupLocation').value.trim();
            const sscBatch = document.getElementById('signupBatch').value.trim();

            if (!email) { showToast('ইমেইল আবশ্যক!', true); return; }
            if (password.length < 6) { showToast('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে!', true); return; }
            if (!/^1[0-9]{9}$/.test(rawPhone)) { showToast('মোবাইল নম্বর 1 দিয়ে শুরু ১০ ডিজিটের হতে হবে!', true); return; }
            if (!/^[0-9]{4}$/.test(sscBatch)) { showToast('এসএসসি ব্যাচ ৪ ডিজিটের হতে হবে!', true); return; }

            if (btn) { btn.disabled = true; btn.textContent = 'একাউন্ট তৈরি হচ্ছে...'; }
            state.signingUp = true;

            try {
                if (await lookupEmail(rawPhone)) {
                    showToast('এই মোবাইল নম্বরে ইতিমধ্যে একটি আইডি আছে!', true);
                    state.signingUp = false;
                    if (btn) { btn.disabled = false; btn.textContent = 'সাইন আপ করুন'; }
                    return;
                }

                const phone = '+880' + rawPhone;
                const cred = await auth.createUserWithEmailAndPassword(email, password);
                const uid = cred.user.uid;
                const profile = {
                    uid,
                    name,
                    phone,
                    profession,
                    age,
                    location,
                    sscBatch,
                    profilePhoto: getAutoAvatar()
                };

                const batch = db.batch();
                batch.set(db.collection('phones').doc(phone.replace('+', '')), { uid, email });
                batch.set(db.collection('users').doc(uid), profile);
                await batch.commit();

                const nid = 'n_' + Date.now();
                await db.collection('notifications').doc(nid).set({
                    id: nid,
                    recipientPhone: phone,
                    text: 'বৈঠকখানা পরিবারে আপনাকে স্বাগতম!',
                    isRead: false,
                    isEditorBroadcast: false,
                    date: 'এইমাত্র',
                    createdAt: Date.now()
                }).catch(() => {});

                state.users.push(profile);
                state.signingUp = false;
                applyMe();
                startListeners();
                showToast('একাউন্ট তৈরি সফল হয়েছে!');
                render();
            } catch (e) {
                state.signingUp = false;
                const msg = {
                    'auth/email-already-in-use': 'এই ইমেইল ইতিমধ্যে ব্যবহৃত হয়েছে!',
                    'auth/invalid-email': 'সঠিক ইমেইল ঠিকানা দিন!',
                    'auth/weak-password': 'পাসওয়ার্ড আরও শক্তিশালী দিন!'
                };
                showToast(msg[e.code] || 'একাউন্ট তৈরি করা যায়নি, আবার চেষ্টা করুন।', true);
                if (btn) { btn.disabled = false; btn.textContent = 'সাইন আপ করুন'; }
            }
        }

        async function lookupEmail(rawPhone) {
            try {
                const d = await db.collection('phones').doc('880' + rawPhone).get();
                return d.exists ? d.data().email : null;
            } catch (e) { return null; }
        }

        function parseLoginId(v) {
            v = v.trim().replace(/\s+/g, '');
            if (v.includes('@')) return { email: v.toLowerCase() };
            const m = v.match(/^(?:\+?880|0)?(1[0-9]{9})$/);
            return m ? { phone: m[1] } : null;
        }

        async function handleLogin(event) {
            event.preventDefault();
            const id = parseLoginId(document.getElementById('loginPhone').value);
            const password = document.getElementById('loginPassword').value;
            if (!id) { showToast('সঠিক ইমেইল বা মোবাইল নম্বর দিন!', true); return; }
            const email = id.email || await lookupEmail(id.phone);
            try {
                if (!email) throw new Error('no-user');
                await auth.signInWithEmailAndPassword(email, password);
            } catch (e) {
                showToast('ইমেইল/মোবাইল অথবা পাসওয়ার্ড ভুল হয়েছে!', true);
            }
        }

        function logout() {
            stopListeners();
            auth.signOut().catch(() => {});
            state.currentUser = null;
            switchView('login');
        }

        async function recoverPasswordPrompt() {
            const raw = await showPromptModal({
                title: 'পাসওয়ার্ড রিসেট',
                placeholder: 'আপনার ইমেইল বা মোবাইল নম্বর দিন',
                confirmLabel: 'লিংক পাঠান'
            });
            if (!raw) return;
            const id = parseLoginId(raw);
            if (!id) { showToast('সঠিক ইমেইল বা মোবাইল নম্বর দিন!', true); return; }
            const email = id.email || await lookupEmail(id.phone);
            if (email) { try { await auth.sendPasswordResetEmail(email); } catch (e) { console.error(e); } }
            showToast('একাউন্ট থাকলে ইমেইলে পাসওয়ার্ড রিসেট লিংক পাঠানো হয়েছে।');
        }

        async function handleCreatePost(event) {
            event.preventDefault();
            const content = document.getElementById('postContent').value.trim();
            const image = document.getElementById('postImage').value.trim();
            if (!content && !image) return;

            const newPost = {
                id: 'p_' + Date.now(),
                authorPhone: state.currentUser.phone,
                authorName: state.currentUser.name,
                authorProfession: state.currentUser.profession,
                authorAvatar: state.currentUser.profilePhoto,
                content,
                image,
                date: 'এইমাত্র',
                createdAt: Date.now(),
                reactions: { 'Masaallah': [], 'Dua Roilo': [], 'Innalillah': [] },
                comments: []
            };

            state.posts.unshift(newPost);
            document.getElementById('postContent').value = '';
            document.getElementById('postImage').value = '';
            await saveDataToCloud();
            render();
        }

        function togglePostMenu(e, id) {
            e.stopPropagation();
            document.querySelectorAll('[id^="pm-"]').forEach(m => { if (m.id !== 'pm-' + id) m.classList.add('hidden'); });
            const m = document.getElementById('pm-' + id);
            if (m) m.classList.toggle('hidden');
        }

        window.addEventListener('click', () => document.querySelectorAll('[id^="pm-"]').forEach(m => m.classList.add('hidden')));

        function closeEditPost() {
            const m = document.getElementById('editPostModal');
            if (m) m.remove();
        }

        function editPost(postId) {
            const post = state.posts.find(p => p.id === postId);
            if (!post || post.authorPhone !== state.currentUser.phone) return;
            closeEditPost();
            const div = document.createElement('div');
            div.id = 'editPostModal';
            div.className = 'fixed inset-0 bg-neutral-900/50 backdrop-blur-xs z-[60] flex items-center justify-center p-4';
            div.innerHTML = `
                <div class="bg-white border border-neutral-200 rounded-2xl max-w-lg w-full p-6 shadow-xl">
                    <h3 class="text-base font-bold text-neutral-900 mb-3">পোস্ট এডিট করুন</h3>
                    <textarea id="editPostText" rows="5" maxlength="5000" class="w-full p-3 rounded-xl border border-neutral-300 focus:border-emerald-600 focus:outline-none text-sm"></textarea>
                    <input id="editPostImage" type="text" placeholder="ছবির লিংক (ঐচ্ছিক)" class="w-full mt-3 px-3 py-2 rounded-xl border border-neutral-300 text-xs focus:border-emerald-600 focus:outline-none">
                    <div class="flex justify-end gap-2 mt-4">
                        <button onclick="closeEditPost()" class="px-4 py-2 rounded-xl bg-neutral-100 hover:bg-neutral-200 text-xs font-bold">বাতিল</button>
                        <button onclick="saveEditedPost('${esc(post.id)}')" class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold">সংরক্ষণ</button>
                    </div>
                </div>`;
            document.body.appendChild(div);
            document.getElementById('editPostText').value = post.content || '';
            document.getElementById('editPostImage').value = post.image || '';
        }

        async function saveEditedPost(postId) {
            const post = state.posts.find(p => p.id === postId);
            if (!post) return;
            const content = document.getElementById('editPostText').value.trim();
            const image = document.getElementById('editPostImage').value.trim();
            if (!content && !image) { showToast('পোস্ট ফাঁকা রাখা যাবে না!', true); return; }
            post.content = content;
            post.image = image;
            post.editedAt = Date.now();
            closeEditPost();
            await saveDataToCloud();
            render();
        }

        async function deletePost(postId) {
            if (await showConfirmModal('আপনি কি নিশ্চিত এই পোস্টটি ডিলিট করতে চান?', 'ডিলিট করুন')) {
                state.activeModalPostId = null;
                state.posts = state.posts.filter(p => p.id !== postId);
                await saveDataToCloud();
                render();
            }
        }

        // রিঅ্যাকশন দিলে পেজ রি-রেন্ডার না করে তাৎক্ষণিক বাটন আপডেট (একটুও না কাঁপার জন্য)
        async function toggleReaction(postId, reactionType) {
            const post = state.posts.find(p => p.id === postId);
            if (!post) return;
            if (!post.reactions) post.reactions = { 'Masaallah': [], 'Dua Roilo': [], 'Innalillah': [] };
            const alreadySelected = (post.reactions[reactionType] || []).includes(state.currentUser.phone);
            Object.keys(post.reactions).forEach(type => {
                post.reactions[type] = (post.reactions[type] || []).filter(phone => phone !== state.currentUser.phone);
            });
            if (!alreadySelected) post.reactions[reactionType].push(state.currentUser.phone);
            updatePostReactionsDOM(postId);
            await saveDataToCloud();
        }

        async function handleComment(event, postId) {
            event.preventDefault();
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;
            const post = state.posts.find(p => p.id === postId);
            if (!post) return;

            post.comments.push({
                id: 'c_' + Date.now(),
                authorPhone: state.currentUser.phone,
                authorName: state.currentUser.name,
                text
            });

            if (post.authorPhone !== state.currentUser.phone) {
                state.notifications.unshift({
                    id: 'n_' + Date.now(),
                    recipientPhone: post.authorPhone,
                    postId: post.id,
                    text: `${state.currentUser.name} আপনার পোস্টে মন্তব্য করেছেন।`,
                    isRead: false,
                    isEditorBroadcast: false,
                    date: 'এইমাত্র',
                    createdAt: Date.now()
                });
            }

            input.value = '';
            render();
            await saveDataToCloud();
        }

        async function deleteComment(postId, commentId) {
            const post = state.posts.find(p => p.id === postId);
            if (!post || !(await showConfirmModal('মন্তব্যটি মুছে ফেলবেন?', 'মুছুন'))) return;
            post.comments = (post.comments || []).filter(c => c.id !== commentId);
            await saveDataToCloud();
            render();
        }

        async function clearAllNotifications() {
            state.notifications = state.notifications.filter(n => n.recipientPhone !== state.currentUser.phone);
            await saveDataToCloud();
            render();
        }

        async function deleteNotification(notifId) {
            state.notifications = state.notifications.filter(n => n.id !== notifId);
            await saveDataToCloud();
            render();
        }

        async function markAsRead(notifId) {
            const notif = state.notifications.find(n => n.id === notifId);
            if (notif) {
                notif.isRead = true;
                await saveDataToCloud();
                render();
            }
        }

        function markAsReadAndOpen(notifId, postId) {
            markAsRead(notifId);
            openPostModal(postId);
        }

        function openPostModal(postId) {
            state.activeModalPostId = postId;
            render();
        }

        function closePostModal() {
            state.activeModalPostId = null;
            render();
        }

        function viewMyProfile() {
            state.viewingProfilePhone = state.currentUser.phone;
            state.currentView = 'profile';
            render();
        }

        function viewUserProfile(phone) {
            state.viewingProfilePhone = phone;
            state.currentView = 'profile';
            render();
        }

        // নিজের ইমেইল পরিবর্তন ফাংশন
        async function promptChangeEmail() {
            const curPass = await showPromptModal({
                title: 'নিরাপত্তার জন্য বর্তমান পাসওয়ার্ড দিন',
                placeholder: 'বর্তমান পাসওয়ার্ড',
                type: 'password',
                confirmLabel: 'পরবর্তী'
            });
            if (!curPass) return;

            try {
                await auth.signInWithEmailAndPassword(auth.currentUser.email, curPass);
            } catch (e) {
                showToast('বর্তমান পাসওয়ার্ড ভুল হয়েছে!', true);
                return;
            }

            const newEmailRaw = await showPromptModal({
                title: 'নতুন ইমেইল ঠিকানা দিন',
                placeholder: 'newemail@example.com',
                type: 'email',
                defaultValue: auth.currentUser.email || '',
                confirmLabel: 'ইমেইল আপডেট করুন'
            });
            if (!newEmailRaw) return;
            const newEmail = newEmailRaw.trim().toLowerCase();
            if (!newEmail || !newEmail.includes('@')) {
                showToast('সঠিক ইমেইল ঠিকানা দিন!', true);
                return;
            }
            if (newEmail === (auth.currentUser.email || '').toLowerCase()) {
                showToast('এটিই আপনার বর্তমান ইমেইল।');
                return;
            }

            try {
                await auth.currentUser.updateEmail(newEmail);
                state.currentUser.email = newEmail;
                const phoneDocId = state.currentUser.phone.replace('+', '');
                await db.collection('phones').doc(phoneDocId).set({
                    uid: state.currentUser.uid,
                    email: newEmail
                }, { merge: true }).catch(() => {});
                showToast('আপনার ইমেইল সফলভাবে পরিবর্তিত হয়েছে!');
                render();
            } catch (e) {
                if (e.code === 'auth/operation-not-allowed' && auth.currentUser.verifyBeforeUpdateEmail) {
                    try {
                        await auth.currentUser.verifyBeforeUpdateEmail(newEmail);
                        showToast('নতুন ইমেইলে একটি নিশ্চিতকরণ লিংক পাঠানো হয়েছে।');
                        return;
                    } catch (err2) {}
                }
                const errMap = {
                    'auth/email-already-in-use': 'এই ইমেইল ইতিমধ্যে অন্য একাউন্টে ব্যবহৃত হচ্ছে!',
                    'auth/invalid-email': 'সঠিক ইমেইল ঠিকানা দিন!'
                };
                showToast(errMap[e.code] || 'ইমেইল পরিবর্তন করা যায়নি, আবার চেষ্টা করুন।', true);
            }
        }

        async function promptChangePhoto() {
            const url = await showPromptModal({
                title: 'প্রোফাইল ছবির লিংক দিন',
                placeholder: 'https://example.com/photo.jpg',
                confirmLabel: 'আপডেট করুন'
            });
            if (!url || !url.trim()) return;
            state.currentUser.profilePhoto = url.trim();
            const u = state.users.find(x => x.phone === state.currentUser.phone);
            if (u) u.profilePhoto = state.currentUser.profilePhoto;
            await saveDataToCloud();
            render();
        }

        async function promptChangePassword() {
            const cur = await showPromptModal({
                title: 'বর্তমান পাসওয়ার্ড দিন',
                placeholder: '••••••••',
                type: 'password',
                confirmLabel: 'পরবর্তী'
            });
            if (!cur) return;
            try {
                await auth.signInWithEmailAndPassword(auth.currentUser.email, cur);
            } catch (e) {
                showToast('বর্তমান পাসওয়ার্ড ভুল!', true);
                return;
            }
            const npRaw = await showPromptModal({
                title: 'নতুন পাসওয়ার্ড দিন (কমপক্ষে ৬ অক্ষর)',
                placeholder: '••••••',
                type: 'password',
                confirmLabel: 'পরিবর্তন করুন'
            });
            const np = (npRaw || '').trim();
            if (np.length < 6) {
                if (np) showToast('কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড দিন!', true);
                return;
            }
            try {
                await auth.currentUser.updatePassword(np);
                showToast('পাসওয়ার্ড পরিবর্তন হয়েছে!');
            } catch (e) {
                showToast('পাসওয়ার্ড পরিবর্তন করা যায়নি।', true);
            }
        }

        function openEditProfileModal() {
            const div = document.createElement('div');
            div.innerHTML = renderEditProfileModal();
            document.body.appendChild(div.firstElementChild);
        }

        function closeEditProfileModal() {
            const modal = document.getElementById('editProfileModal');
            if (modal) modal.remove();
        }

        async function handleUpdateProfile(event) {
            event.preventDefault();
            const sscBatch = document.getElementById('editBatch').value.trim();
            if (!/^[0-9]{4}$/.test(sscBatch)) { showToast('এসএসসি ব্যাচ ৪ ডিজিটের হতে হবে!', true); return; }

            state.currentUser.name = document.getElementById('editName').value.trim();
            state.currentUser.age = document.getElementById('editAge').value.trim();
            state.currentUser.location = document.getElementById('editLocation').value.trim();
            state.currentUser.sscBatch = sscBatch;

            const u = state.users.find(x => x.phone === state.currentUser.phone);
            if (u) {
                u.name = state.currentUser.name;
                u.age = state.currentUser.age;
                u.location = state.currentUser.location;
                u.sscBatch = state.currentUser.sscBatch;
            }

            await saveDataToCloud();
            closeEditProfileModal();
            showToast('প্রোফাইল আপডেট হয়েছে!');
            render();
        }

        async function adminDeleteUser(phone) {
            if (await showConfirmModal(`এই ইউজার (${phone}) এবং তার পোস্ট মুছে ফেলবেন?`, 'ইউজার ডিলিট')) {
                db.collection('phones').doc(phone.replace('+', '')).delete().catch(() => {});
                state.users = state.users.filter(u => u.phone !== phone);
                state.posts = state.posts.filter(p => p.authorPhone !== phone);
                await saveDataToCloud();
                switchView('all_members');
            }
        }

        async function handleEditorBroadcast(event) {
            event.preventDefault();
            const target = document.getElementById('broadcastTarget').value;
            const text = document.getElementById('broadcastText').value.trim();
            if (!text) return;

            if (target === 'ALL') {
                state.users.forEach(u => {
                    state.notifications.unshift({
                        id: 'nb_' + Date.now() + '_' + u.phone,
                        recipientPhone: u.phone,
                        text: text,
                        isRead: false,
                        isEditorBroadcast: true,
                        date: 'এইমাত্র',
                        createdAt: Date.now()
                    });
                });
            } else {
                state.notifications.unshift({
                    id: 'nb_' + Date.now(),
                    recipientPhone: target,
                    text: text,
                    isRead: false,
                    isEditorBroadcast: true,
                    date: 'এইমাত্র',
                    createdAt: Date.now()
                });
            }

            document.getElementById('broadcastText').value = '';
            await saveDataToCloud();
            showToast('বিজ্ঞপ্তি পাঠানো হয়েছে!');
            render();
        }

        function render() {
            const app = document.getElementById('app');
            if (!state.authReady) {
                app.innerHTML = '<div class="min-h-screen flex items-center justify-center text-neutral-500 text-sm">লোড হচ্ছে...</div>';
                return;
            }

            let contentHTML = '';
            if (!state.currentUser) {
                contentHTML = state.currentView === 'signup' ? renderSignup() : renderLogin();
            } else {
                switch (state.currentView) {
                    case 'feed': contentHTML = renderFeed(); break;
                    case 'notifications': contentHTML = renderNotifications(); break;
                    case 'profile': contentHTML = renderProfile(state.viewingProfilePhone); break;
                    case 'all_members': contentHTML = renderAllMembers(); break;
                    case 'editor_panel': contentHTML = renderEditorPanel(); break;
                    default: contentHTML = renderFeed();
                }
            }

            contentHTML += renderPostModal();
            contentHTML += renderWelcomePopup();

            const saved = {};
            app.querySelectorAll('#postContent, #postImage, [id^="comment-input-"]').forEach(el => {
                if (el.value) saved[el.id] = el.value;
            });
            const a = document.activeElement;
            const focusId = a && app.contains(a) ? a.id : null;
            const pos = a ? a.selectionStart : null;

            app.innerHTML = contentHTML;

            Object.keys(saved).forEach(id => {
                const el = document.getElementById(id);
                if (el && !el.value) el.value = saved[id];
            });
            if (focusId) {
                const el = document.getElementById(focusId);
                if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} }
            }
            schedulePopupAutoDismiss();
        }
    </script>
