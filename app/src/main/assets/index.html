            return String(v ?? '').replace(/[&<>"']/g, c => ({

            }[c]));

            u = String(u || '');
            if (u.startsWith('data:image/')) return esc(u);
            try {
                const x = new URL(u);
                return (x.protocol === 'https:' || x.protocol === 'http:') ? esc(u) : '';

                const overlay = document.createElement('div');
                overlay.className = 'fixed inset-0 bg-neutral-900/50 backdrop-blur-xs z-[90] flex items-center justify-center p-4';
                overlay.innerHTML = `
                    <div class="bg-white border border-neutral-200 rounded-2xl max-w-sm w-full p-5 shadow-xl">
                        <h3 class="text-base font-bold text-neutral-900 mb-3">${esc(title)}</h3>
                        <input id="customPromptInput" type="${esc(type)}" value="${esc(defaultValue)}" placeholder="${esc(placeholder)}" class="w-full px-3.5 py-2.5 rounded-xl border border-neutral-300 focus:border-emerald-600 focus:outline-none text-sm mb-4">
                        <div class="flex justify-end gap-2">
                            <button type="button" id="customPromptCancel" class="px-4 py-2 rounded-xl bg-neutral-100 hover:bg-neutral-200 text-neutral-700 text-xs font-bold">বাতিল</button>
                            <button type="button" id="customPromptOk" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold">${esc(confirmLabel)}</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(overlay);
                const input = overlay.querySelector('#customPromptInput');
                input.focus();
                const close = val => { overlay.remove(); resolve(val); };
                overlay.querySelector('#customPromptCancel').onclick = () => close(null);
                overlay.querySelector('#customPromptOk').onclick = () => close(input.value);
                input.onkeydown = e => {
                    if (e.key === 'Enter') { e.preventDefault(); close(input.value); }
                    if (e.key === 'Escape') close(null);
                };
            });
        }

        document.addEventListener('error', e => {

            if (t.alt === 'Post image' || t.alt === 'Popup image') t.parentElement.style.display = 'none';

        function timeAgo(ts, fallback) {
            if (!ts) return fallback || 'এইমাত্র';
            const s = Math.floor((Date.now() - ts) / 1000);
            if (s < 60) return 'এইমাত্র';
            if (s < 3600) return bnNum(Math.floor(s / 60)) + ' মিনিট আগে';
            if (s < 86400) return bnNum(Math.floor(s / 3600)) + ' ঘণ্টা আগে';
            if (s < 2592000) return bnNum(Math.floor(s / 86400)) + ' দিন আগে';
            return new Date(ts).toLocaleDateString('bn-BD', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        // বাংলাদেশ স্ট্যান্ডার্ড সময় (BST, UTC+6)
        function getBangladeshDateObj() {
            const now = new Date();
            const utcMs = now.getTime() + (now.getTimezoneOffset() * 60000);
            return new Date(utcMs + (6 * 3600000));
        }

        function getStandardTimeBD() {
            const d = getBangladeshDateObj();
            const h = d.getHours();
            const m = String(d.getMinutes()).padStart(2, '0');
            const s = String(d.getSeconds()).padStart(2, '0');
            let period = 'রাত';
            if (h >= 4 && h < 6) period = 'ভোর';
            else if (h >= 6 && h < 12) period = 'সকাল';
            else if (h >= 12 && h < 15) period = 'দুপুর';
            else if (h >= 15 && h < 18) period = 'বিকাল';
            else if (h >= 18 && h < 20) period = 'সন্ধ্যা';
            const h12 = h % 12 || 12;
            return `${period} ${toBnDigits(h12)}:${toBnDigits(m)}:${toBnDigits(s)} (বাংলাদেশ সময়)`;
        }

        // সঠিক বাংলা সন (সংশোধিত বাংলা বর্ষপঞ্জি)
        function banglaDate(d = getBangladeshDateObj()) {
            const y = d.getFullYear();
            let sy = y, by = y - 593;
            if (Date.UTC(y, d.getMonth(), d.getDate()) < Date.UTC(y, 3, 14)) {
                sy = y - 1;
                by = y - 594;
            }
            let off = Math.round((Date.UTC(y, d.getMonth(), d.getDate()) - Date.UTC(sy, 3, 14)) / 864e5);
            const ny = sy + 1;
            const leap = (ny % 4 === 0 && ny % 100 !== 0) || ny % 400 === 0;
            const lens = [31, 31, 31, 31, 31, 31, 30, 30, 30, 30, leap ? 30 : 29, 30];
            const names = ['বৈশাখ', 'জ্যৈষ্ঠ', 'আষাঢ়', 'শ্রাবণ', 'ভাদ্র', 'আশ্বিন', 'কার্তিক', 'অগ্রহায়ণ', 'পৌষ', 'মাঘ', 'ফাল্গুন', 'চৈত্র'];
            let m = 0;
            while (m < 11 && off >= lens[m]) { off -= lens[m]; m++; }
            return `${bnNum(off + 1)} ${names[m]} ${bnNum(by)} বাংলা সন`;
        }

        // সঠিক হিজরি তারিখ ও বাংলায় আরবি মাসের নাম
        function hijriDateBD(d = getBangladeshDateObj()) {
            const bdDay = new Date(d.getTime() - 864e5);
            const hijriMonthsBn = [
                'মুহররম', 'সফর', 'রবিউল আউয়াল', 'রবিউস সানি',
                'জমাদিউল আউয়াল', 'জমাদিউস সানি', 'রজব', 'শাবান',
                'রমজান', 'শাওয়াল', 'জিলকদ', 'জিলহজ'
            ];

            for (const cal of ['islamic-umalqura', 'islamic-civil', 'islamic']) {
                try {
                    const parts = new Intl.DateTimeFormat(`en-u-ca-${cal}`, {
                        day: 'numeric',
                        month: 'numeric',
                        year: 'numeric'
                    }).formatToParts(bdDay);
                    const dayNum = parseInt(parts.find(p => p.type === 'day')?.value || '', 10);
                    const monthNum = parseInt(parts.find(p => p.type === 'month')?.value || '', 10);
                    const yearNum = parseInt(parts.find(p => p.type === 'year')?.value || '', 10);
                    if (dayNum >= 1 && dayNum <= 30 && monthNum >= 1 && monthNum <= 12 && yearNum > 1400) {
                        return `${bnNum(dayNum)} ${hijriMonthsBn[monthNum - 1]} ${bnNum(yearNum)} হিজরি`;
                    }
                } catch (e) {}
            }

            // ব্যাকআপ গাণিতিক হিজরি হিসাব
            const jd = Math.floor((Date.UTC(bdDay.getFullYear(), bdDay.getMonth(), bdDay.getDate()) / 864e5) + 2440587.5);
            let l = jd - 1948440 + 10632;
            const n = Math.floor((l - 1) / 10631);
            l = l - 10631 * n + 354;
            const j = (Math.floor((10985 - l) / 5316)) * (Math.floor((50 * l) / 17719)) + (Math.floor(l / 5670)) * (Math.floor((43 * l) / 15238));
            l = l - (Math.floor((30 - j) / 15)) * (Math.floor((17719 * j) / 50)) - (Math.floor(j / 16)) * (Math.floor((15238 * j) / 43)) + 29;
            const hMonth = Math.floor((24 * l) / 709);
            const hDay = l - Math.floor((709 * hMonth) / 24);
            const hYear = 30 * n + j - 30;
            const monthBn = hijriMonthsBn[Math.max(0, Math.min(11, hMonth - 1))];
            return `${bnNum(hDay)} ${monthBn} ${bnNum(hYear)} হিজরি`;
        }

        function todayStoryText() {
            const d = getBangladeshDateObj();
            const weekdaysBn = ['রবিবার', 'সোমবার', 'মঙ্গলবার', 'বুধবার', 'বৃহস্পতিবার', 'শুক্রবার', 'শনিবার'];
            const monthsBn = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
            const wd = weekdaysBn[d.getDay()];
            const en = `${bnNum(d.getDate())} ${monthsBn[d.getMonth()]} ${bnNum(d.getFullYear())} খ্রিস্টাব্দ`;
            const bn = banglaDate(d);
            const ar = hijriDateBD(d);
            return `বার: ${wd}\nইংরেজি: ${en}\nবাংলা: ${bn}\nআরবি: ${ar}`;
        }

        function liveStory(st) {
            if (st.mode === 'manual') return st;
            if (st.id === 'st1') return { ...st, text: todayStoryText() };
            if (st.id === 'st4') {
                const slot = Math.floor(Date.now() / OTHER_TTL);
                const pr = PROVERBS[slot % PROVERBS.length];
                return { ...st, text: `“${pr[0]}”\nঅর্থ: ${pr[1]}` };
            }
            return st;
        }

        // লাইভ স্ট্যান্ডার্ড ঘড়ি আপডেট (প্রতি সেকেন্ডে, পেজ রি-রেন্ডার না করে)
        setInterval(() => {

        async function fetchJson(url, ms = 7500) {
            const c = new AbortController();
            const t = setTimeout(() => c.abort(), ms);
            try {
                const r = await fetch(url, { signal: c.signal });
                if (!r.ok) throw new Error(r.status);
                return await r.json();
            } finally { clearTimeout(t); }
        }

        // ---------- রিয়েল সংবাদ সোর্স (একাধিক বাংলা পত্রিকার RSS) ----------
        const NEWS_SOURCES = [
            { name: 'বিবিসি বাংলা', rss: 'https://feeds.bbci.co.uk/bengali/rss.xml' },
            { name: 'প্রথম আলো', rss: 'https://www.prothomalo.com/feed/' },
            { name: 'যুগান্তর', rss: 'https://www.jugantor.com/feed/rss.xml' },
            { name: 'কালের কণ্ঠ', rss: 'https://www.kalerkantho.com/rss.xml' },
            { name: 'জাগো নিউজ', rss: 'https://www.jagonews24.com/rss/rss.xml' },
            { name: 'বাংলা নিউজ ২৪', rss: 'https://www.banglanews24.com/rss/rss.xml' }
        ];
        const isHttpLink = u => /^https?:\/\//i.test(String(u || ''));
        const isManual = i => !!(fixedStories[i] && fixedStories[i].mode === 'manual');

        function parseFeedTime(p) {
            p = String(p || '').trim();
            if (/^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$/.test(p)) return Date.parse(p.replace(' ', 'T') + 'Z') || 0;
            const t = Date.parse(p);
            return isNaN(t) ? 0 : Math.min(t, Date.now());
        }

        function parseFeedXml(xml, srcName) {
            const doc = new DOMParser().parseFromString(xml, 'text/xml');
            return Array.from(doc.querySelectorAll('item')).slice(0, 15).map(it => {
                const g = tag => (it.querySelector(tag)?.textContent || '').trim();
                return { title: g('title'), link: g('link'), time: parseFeedTime(g('pubDate')), source: srcName };
            });
        }

        async function fetchFeedItems(src) {
            // ১ম চেষ্টা: rss2json; ব্যর্থ হলে ২য় চেষ্টা: সরাসরি RSS XML (প্রক্সি দিয়ে)
            try {
                const f = await fetchJson('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(src.rss), 6500);
                if (f.status && f.status !== 'ok') throw new Error('rss2json');
                const items = (f.items || []).slice(0, 15).map(i => ({
                    title: i.title, link: i.link, time: parseFeedTime(i.pubDate), source: src.name
                }));
                if (items.length) return items;
            } catch (e) {}
            const c = new AbortController();
            const t = setTimeout(() => c.abort(), 6500);
            try {
                const r = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(src.rss), { signal: c.signal });
                if (!r.ok) throw new Error(r.status);
                return parseFeedXml(await r.text(), src.name);
            } finally { clearTimeout(t); }
        }

        async function pushStoriesToCloud(extra = {}) {
            try {
                await db.collection('config').doc('stories').set({

            }
        }

        async function refreshNewsEveryHour(force = false) {
            if (!auth.currentUser || newsBusy) return false;
            if (isManual(4)) {
                if (force) showToast('সংবাদ কার্ড এখন ম্যানুয়াল মোডে আছে। অটোতে ফেরালে আপডেট হবে।', true);
                return false;
            }
            if (!force && (Date.now() - newsUpdatedAt < NEWS_TTL)) return false;
            newsBusy = true;
            try {
                const results = await Promise.allSettled(NEWS_SOURCES.map(fetchFeedItems));
                const now = Date.now();
                let all = [];
                let liveSources = 0;
                results.forEach(r => {
                    if (r.status === 'fulfilled' && r.value.length) { liveSources++; all = all.concat(r.value); }
                });
                all = all
                    .map(i => ({ ...i, title: clip(i.title, 110) }))
                    .filter(i => hasBengaliScript(i.title) && isHttpLink(i.link))
                    .filter(i => !i.time || now - i.time < 48 * 3600 * 1000);
                all.sort((a, b) => (b.time || 0) - (a.time || 0));

                const cap = liveSources >= 3 ? 2 : 4;
                const perSrc = {};
                const seen = new Set();
                const picked = [];
                for (const i of all) {
                    const key = i.title.replace(/[\s\u200c\u200d।,.\-–:‘’“”"']/g, '').slice(0, 40);
                    if (seen.has(key) || (perSrc[i.source] || 0) >= cap) continue;
                    seen.add(key);
                    perSrc[i.source] = (perSrc[i.source] || 0) + 1;
                    picked.push(i);
                    if (picked.length >= 6) break;
                }
                if (!picked.length) {
                    if (force) showToast('এই মুহূর্তে কোনো সোর্স থেকে সংবাদ আনা যায়নি।', true);
                    return false;
                }
                const news = picked.map(i => ({ t: i.title, u: i.link, s: i.source, d: i.time || 0 }));
                const text = news.map(n => '• ' + n.t + ' (' + n.s + ')').join('\n')
                    + '\n— সূত্র: ' + [...new Set(news.map(n => n.s))].join(', ');
                fixedStories[4] = { id: 'st5', title: 'সর্বশেষ সংবাদ', text, news };
                newsUpdatedAt = Date.now();
                saveLocalStoriesCache();
                if (state.currentUser?.isEditor) {
                    db.collection('config').doc('stories').set({
                        items: fixedStories,
                        newsUpdatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true }).catch(() => {});
                }
                render();
                if (force) showToast('সর্বশেষ সংবাদ আপডেট হয়েছে!');
                return true;
            } catch (e) {
                return false;
            } finally {
                newsBusy = false;
            }
        }

        async function refreshOtherStoriesEvery6Hours(force = false) {
            if (!auth.currentUser || storyBusy) return false;
            const skipAyah = isManual(1), skipHadith = isManual(2);
            if (skipAyah && skipHadith) {
                if (force) showToast('কুরআন ও হাদিস কার্ড এখন ম্যানুয়াল মোডে আছে।', true);
                return false;
            }
            if (!force && (Date.now() - otherUpdatedAt < OTHER_TTL)) return false;
            storyBusy = true;
            try {
                const slot = force ? Math.floor(Date.now() / 1000) : Math.floor(Date.now() / OTHER_TTL);
                const next = fixedStories.map(x => ({ ...x }));
                let ok = 0;

                await Promise.all([
                    // কুরআন: আরবি (উসমানী) + বাংলা অনুবাদ, একই কলে; সংক্ষিপ্ত আয়াত বেছে নেওয়া হয়
                    skipAyah ? null : (async () => {
                        for (let a = 0; a < 4; a++) {
                            try {
                                const n = ((slot * 37 + a * 911) % 6236) + 1;
                                const d = (await fetchJson('https://api.alquran.cloud/v1/ayah/' + n + '/editions/quran-uthmani,bn.bengali')).data;
                                if (!Array.isArray(d)) continue;
                                const ar = d.find(x => x.edition && x.edition.identifier === 'quran-uthmani');
                                const bn = d.find(x => x.edition && x.edition.identifier === 'bn.bengali');
                                if (!bn || !hasBengaliScript(bn.text) || bn.text.length > 320) continue;
                                const sNum = bn.surah.number;
                                const surahBn = SURAH_NAMES_BN[sNum] || `সূরা ${bnNum(sNum)}`;
                                const arabic = ar && ar.text && ar.text.length < 400 ? ar.text.trim() + '\n\n' : '';
                                next[1] = {
                                    id: 'st2',
                                    title: 'আজকের কুরআন আয়াত',
                                    text: `${arabic}“${bn.text.trim()}”\n— সূরা ${surahBn} (${bnNum(sNum)}), আয়াত নং: ${bnNum(bn.numberInSurah)}`
                                };
                                ok++;
                                return;
                            } catch (e) {}
                        }
                    })(),
                    // হাদিস: বুখারী, মুসলিম, আবু দাউদ (বাংলা সংস্করণ) থেকে সংক্ষিপ্ত হাদিস
                    skipHadith ? null : (async () => {
                        const editions = [
                            ['ben-bukhari', 4000, 'সহীহ বুখারী'],
                            ['ben-muslim', 3000, 'সহীহ মুসলিম'],
                            ['ben-abudawud', 3500, 'সুনানে আবু দাউদ']
                        ];
                        for (const [ed, max, name] of editions) {
                            for (let a = 0; a < 3; a++) {
                                try {
                                    const n = ((slot * 53 + a * 617) % max) + 1;
                                    const h = await fetchJson(`https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/${ed}/${n}.json`);
                                    const first = h.hadiths && h.hadiths[0];
                                    const t = (h.text || (first && first.text) || '').trim();
                                    if (!t || !hasBengaliScript(t) || t.length > 380) continue;
                                    const num = h.hadithnumber || (first && first.hadithnumber) || n;
                                    next[2] = {
                                        id: 'st3',
                                        title: 'আজকের হাদিস',
                                        text: `“${t}”\n— ${name}, হাদিস নং: ${bnNum(num)}`
                                    };
                                    ok++;
                                    return;
                                } catch (e) {}
                            }
                        }
                    })()
                ]);

                // কিছুই আনা না গেলে আগের (সত্যিকারের) কার্ডই থাকবে; পরের ৩০ মিনিটে আবার চেষ্টা হবে
                if (ok === 0) {
                    if (force) showToast('এই মুহূর্তে কুরআন/হাদিস আনা যায়নি। পরে আবার চেষ্টা করুন।', true);
                    return false;
                }
                fixedStories = next;
                otherUpdatedAt = Date.now();
                saveLocalStoriesCache();
                if (state.currentUser?.isEditor) {
                    db.collection('config').doc('stories').set({
                        items: fixedStories,
                        otherUpdatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true }).catch(() => {});
                }
                render();
                if (force) showToast('কুরআন ও হাদিস আপডেট হয়েছে!');
                return true;
            } catch (e) {
                return false;
            } finally {

            }
        }

        async function saveStoryCard(i) {
            if (!state.currentUser?.isEditor) return;
            const base = fixedStories[i];
            const mode = document.getElementById('cardMode_' + i).value;
            const title = document.getElementById('cardTitle_' + i).value.trim();
            const text = document.getElementById('cardText_' + i).value.trim();
            if (mode === 'manual') {
                if (!title || !text) {
                    showToast('ম্যানুয়াল কার্ডে শিরোনাম ও লেখা দুটোই দিন!', true);
                    return;
                }
                fixedStories[i] = { id: base.id, title, text, mode: 'manual' };
            } else {
                fixedStories[i] = { ...STORY_DEFAULTS[i] };
            }
            saveLocalStoriesCache();
            await pushStoriesToCloud();
            render();
            if (mode === 'manual') {
                showToast('কার্ড ম্যানুয়াল মোডে সংরক্ষণ হয়েছে।');
            } else {
                showToast('কার্ড অটো মোডে ফিরেছে।');
                if (i === 4) refreshNewsEveryHour(true);
                else if (i === 1 || i === 2) refreshOtherStoriesEvery6Hours(true);
            }
        }

        function toggleStoryOpen(id) {
            storyOpen[id] = !storyOpen[id];
            render();
        }

        setInterval(() => refreshNewsEveryHour(false), 15 * 60 * 1000);
        setInterval(() => refreshOtherStoriesEvery6Hours(false), 30 * 60 * 1000);

        async function saveDataToCloud() {
            if (!auth.currentUser) return;
            try {
                const batch = db.batch();
                let n = 0;
                for (const col of ['users', 'posts', 'notifications']) {
                    const cur = {};
                    state[col].forEach(o => { cur[idOf(col, o)] = strip(col, o); });
                    for (const id in cur) {
                        const j = JSON.stringify(cur[id]);
                        if (synced[col][id] !== j) {
                            batch.set(db.collection(col).doc(id), cur[id]);
                            synced[col][id] = j;
                            n++;
                        }
                    }
                    for (const id in synced[col]) {
                        if (!(id in cur)) {
                            batch.delete(db.collection(col).doc(id));
                            delete synced[col][id];
                            n++;
                        }
                    }
                }
                const st = JSON.stringify(fixedStories);
                if (state.currentUser && state.currentUser.isEditor && st !== synced.stories) {
                    batch.set(db.collection('config').doc('stories'), {
                        items: fixedStories,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });
                    synced.stories = st;
                    n++;
                }
                if (n) await batch.commit();
            } catch (error) {
                console.error('Cloud Save Error:', error);
                showToast('সংরক্ষণ করা যায়নি। আবার চেষ্টা করুন।', true);
            }
        }

        function applyMe() {
            const au = auth.currentUser;
            if (!au) return false;
            const emailMatchEditor = (au.email || '').toLowerCase() === EDITOR_EMAIL;
            state.users.forEach(u => {
                u.isEditor = state.adminIds.has(u.uid) || (emailMatchEditor && u.uid === au.uid);
            });
            let me = state.users.find(u => u.uid === au.uid);
            if (!me && emailMatchEditor) {
                me = {
                    uid: au.uid,
                    name: 'প্রধান সম্পাদক',
                    phone: '+8801700000000',
                    profession: 'সম্পাদক',
                    age: '৩০',
                    location: 'ঢাকা',
                    sscBatch: '2015',
                    profilePhoto: getAutoAvatar(),
                    isEditor: true
                };
                state.users.push(me);
                db.collection('users').doc(au.uid).set(strip('users', me), { merge: true }).catch(() => {});
                db.collection('admins').doc(au.uid).set({ email: EDITOR_EMAIL, role: 'editor' }, { merge: true }).catch(() => {});
            }
            if (!me) return false;
            const first = !state.currentUser;
            state.currentUser = Object.assign({}, me, {
                email: au.email,
                isEditor: state.adminIds.has(au.uid) || emailMatchEditor
            });
            if (first) {
                state.authReady = true;
                if (state.currentView === 'login' || state.currentView === 'signup') state.currentView = 'feed';
                startNotifListener(me.phone);
                refreshNewsEveryHour(false);
                refreshOtherStoriesEvery6Hours(false);
            }
            return true;
        }

        let unsubs = [], notifUnsub = null, postsUnsub = null;

        function stopListeners() {
            unsubs.forEach(u => u());
            unsubs = [];
            if (notifUnsub) { notifUnsub(); notifUnsub = null; }
            if (postsUnsub) { postsUnsub(); postsUnsub = null; }
        }

        function startNotifListener(phone) {
            if (notifUnsub) notifUnsub();
            notifUnsub = db.collection('notifications').where('recipientPhone', '==', phone).onSnapshot(snap => {
                state.notifications = snap.docs.map(d => d.data()).sort(byNewest);
                synced.notifications = {};
                state.notifications.forEach(o => { synced.notifications[o.id] = JSON.stringify(o); });
                render();
            }, e => console.error(e));
        }

        function startPostsListener() {
            if (postsUnsub) postsUnsub();
            postsUnsub = db.collection('posts').orderBy('createdAt', 'desc').limit(state.postLimit).onSnapshot(snap => {
                state.postsMore = snap.docs.length >= state.postLimit;
                state.posts = snap.docs.map(d => d.data());
                synced.posts = {};
                state.posts.forEach(o => { synced.posts[o.id] = JSON.stringify(o); });
                render();
            }, e => console.error(e));
        }

        function loadMorePosts() {
            state.postLimit += 15;
            startPostsListener();
        }

        function startListeners() {
            const err = e => console.error(e);
            unsubs.push(db.collection('admins').onSnapshot(snap => {
                state.adminIds = new Set(snap.docs.map(d => d.id));
                applyMe();
                render();
            }, err));
            unsubs.push(db.collection('users').onSnapshot(snap => {
                state.users = snap.docs.map(d => d.data());
                synced.users = {};
                state.users.forEach(o => { synced.users[o.uid] = JSON.stringify(strip('users', o)); });
                if (!applyMe() && !state.signingUp && !snap.metadata.fromCache && !snap.metadata.hasPendingWrites) {
                    auth.signOut();
                    return;
                }
                render();
            }, err));
            startPostsListener();
            unsubs.push(db.collection('config').doc('stories').onSnapshot(d => {
                if (d.exists && Array.isArray(d.data().items)) {
                    const cloudItems = d.data().items;
                    cloudItems.forEach((item, idx) => {
                        if (idx < 5 && validStory(item, idx)) {
                            fixedStories[idx] = item;
                        }
                    });
                    synced.stories = JSON.stringify(fixedStories);
                    const nTs = d.data().newsUpdatedAt || d.data().updatedAt;
                    const oTs = d.data().otherUpdatedAt || d.data().updatedAt;
                    if (nTs && nTs.toMillis) newsUpdatedAt = nTs.toMillis();
                    if (oTs && oTs.toMillis) otherUpdatedAt = oTs.toMillis();
                    saveLocalStoriesCache();
                }
                render();
                refreshNewsEveryHour(false);
                refreshOtherStoriesEvery6Hours(false);
            }, err));
            // এডিটর প্যানেল থেকে সেট করা পপআপ উইন্ডো রিয়েল-টাইম লিসেনার
            unsubs.push(db.collection('config').doc('popup').onSnapshot(d => {
                state.popupConfig = d.exists ? d.data() : null;
                render();
            }, err));
        }

        // সরাসরি অথেনটিকেশন (কোনো ইমেইল ভেরিফিকেশন ছাড়াই)
        auth.onAuthStateChanged(async user => {
            stopListeners();
            if (!user) {
                state.currentUser = null;
                state.notifications = [];
                state.popupDismissedId = null;
                state.authReady = true;
                if (state.currentView !== 'signup') state.currentView = 'login';
                render();
                return;
            }
            try {
                const pd = await db.collection('pending').doc(user.uid).get();
                if (pd.exists) {
                    const d = pd.data();
                    const b = db.batch();
                    b.set(db.collection('phones').doc(d.phone.replace('+', '')), { uid: user.uid, email: user.email });
                    b.set(db.collection('users').doc(user.uid), d.profile);
                    b.delete(db.collection('pending').doc(user.uid));
                    await b.commit();
                }
            } catch (e) {}
            state.signingUp = false;
            state.popupDismissedId = null;
            startListeners();
        });

                                পরবর্তী <i class="fa-solid fa-arrow-right text-[10px]"></i>
                            </button>
                        </div>
                    </div>

                    <!-- পোস্ট তৈরির বক্স -->
                    <div class="clean-card p-4">
                        <div class="flex items-center space-x-3 mb-3">
                            <img src="${safeUrl(state.currentUser.profilePhoto)}" class="w-9 h-9 rounded-full border border-neutral-200 object-cover">
                            <div>
                                <h4 class="font-bold text-sm text-neutral-900">${esc(state.currentUser.name)}</h4>
                                <span class="text-[11px] bg-emerald-50 text-emerald-800 border border-emerald-200 px-2 py-0.5 rounded-full font-medium">${esc(state.currentUser.profession)}</span>
                            </div>
                        </div>
                        <form onsubmit="handleCreatePost(event)" class="space-y-2.5">
                            <textarea id="postContent" rows="3" maxlength="5000" placeholder="আজ আপনার মনে কী চলছে?" class="w-full p-3 rounded-xl border border-neutral-200 focus:border-emerald-600 focus:outline-none text-sm resize-none"></textarea>
                            <div class="flex items-center justify-between gap-2">
                                <input type="text" id="postImage" placeholder="ছবির লিংক (ঐচ্ছিক)" class="w-2/3 px-3 py-2 rounded-xl border border-neutral-200 text-xs focus:border-emerald-600 focus:outline-none">
                                <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition">পোস্ট করুন</button>
                            </div>
                        </form>
                    </div>

                    <!-- পোস্ট ফিড -->
                    <div class="space-y-4">
                        ${visiblePosts.length === 0 ? '<p class="text-center text-neutral-500 py-10 text-sm">এখনো কোনো পোস্ট নেই।</p>' : ''}
                        ${visiblePosts.map(post => renderPostCard(post)).join('')}
                        ${state.postsMore ? '<button onclick="loadMorePosts()" class="w-full py-2.5 rounded-xl bg-white border border-neutral-200 text-neutral-800 text-xs font-bold hover:bg-emerald-50 transition">আরও পোস্ট দেখুন</button>' : ''}
                    </div>
                </main>
            `;
        }

        function renderStoryBody(st) {
            const open = !!storyOpen[st.id];
            const toggle = label => `<button onclick="toggleStoryOpen('${st.id}')" class="mt-1.5 text-xs font-bold text-emerald-800 hover:underline">${label}</button>`;
            if (st.id === 'st5' && st.mode !== 'manual' && Array.isArray(st.news) && st.news.length) {
                const list = open ? st.news : st.news.slice(0, 3);
                return `<ul class="mt-1.5 space-y-1.5">${list.map(n => {
                    const u = isHttpLink(n.u) ? safeUrl(n.u) : '';
                    const t = esc(n.t);
                    return `<li class="text-sm font-medium text-neutral-800 leading-relaxed break-words">• ${u ? `<a href="${u}" target="_blank" rel="noopener noreferrer" class="hover:text-emerald-800 hover:underline">${t}</a>` : t} <span class="text-[11px] text-neutral-500">— ${esc(n.s)}${n.d ? ' · ' + esc(timeAgo(n.d)) : ''}</span></li>`;
                }).join('')}</ul>${st.news.length > 3 ? toggle(open ? 'কম দেখান' : `আরও ${bnNum(st.news.length - 3)}টি সংবাদ দেখুন`) : ''}`;
            }
            const txt = String(st.text || '');
            const big = txt.length > 200 || txt.split('\n').length > 6;
            return `<p class="text-sm font-medium text-neutral-800 leading-relaxed mt-1.5 whitespace-pre-line break-words ${big && !open ? 'story-clamp' : ''}">${esc(txt)}</p>${big ? toggle(open ? 'কম দেখান' : 'আরও পড়ুন') : ''}`;
        }

        function goStory(i) {
            storyIndex = i;
            render();
        }

        function nextStory() {
            storyIndex = (storyIndex + 1) % fixedStories.length;
            render();
        }

        // পোস্ট কার্ড (কোনো অ্যানিমেশন বা লাফানো ছাড়া স্থির ডিজাইন)
        function renderPostCard(post, isModal = false) {
            const isAuthor = post.authorPhone === state.currentUser?.phone;
            const isAdmin = state.currentUser?.isEditor;
            const isLong = (post.content || '').length > 220;
            const displayText = isLong ? post.content.substring(0, 220) + '...' : (post.content || '');

            if (!post.reactions) post.reactions = { 'Masaallah': [], 'Dua Roilo': [], 'Innalillah': [] };
            const mCount = post.reactions['Masaallah']?.length || 0;
            const dCount = post.reactions['Dua Roilo']?.length || 0;
            const iCount = post.reactions['Innalillah']?.length || 0;
            const totalReactions = mCount + dCount + iCount;
            const myReaction = Object.keys(post.reactions).find(key => post.reactions[key].includes(state.currentUser?.phone));

            if (!post.comments) post.comments = [];
            const commentsToShow = isModal ? post.comments : post.comments.slice(-2);

            return `
                <div data-post-card="${esc(post.id)}" class="clean-card p-5 relative">
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex items-center space-x-3 cursor-pointer" onclick="viewUserProfile('${esc(post.authorPhone)}')">
                            <img src="${safeUrl(post.authorAvatar || getAutoAvatar())}" class="w-10 h-10 rounded-full border border-emerald-200 object-cover">
                            <div>
                                <h3 class="font-bold text-neutral-900 hover:text-emerald-700 text-sm">${esc(post.authorName)}</h3>
                                <div class="flex items-center space-x-2 text-[11px] text-neutral-500">
                                    <span class="bg-neutral-100 text-neutral-700 px-2 py-0.5 rounded font-medium">${esc(post.authorProfession)}</span>
                                    <span>•</span>
                                    <span>${timeAgo(post.createdAt, post.date)}${post.editedAt ? ' · সম্পাদিত' : ''}</span>
                                </div>
                            </div>
                        </div>
                        ${isAuthor || isAdmin ? `
                            <div class="relative">
                                <button onclick="togglePostMenu(event, '${esc(post.id)}')" class="text-neutral-400 hover:text-neutral-800 hover:bg-neutral-100 w-8 h-8 rounded-full flex items-center justify-center" aria-label="পোস্ট মেনু">
                                    <i class="fa-solid fa-ellipsis-vertical"></i>
                                </button>
                                <div id="pm-${esc(post.id)}" class="hidden absolute right-0 mt-1 w-32 bg-white border border-neutral-200 rounded-xl shadow-lg z-20 py-1 text-xs overflow-hidden">
                                    ${isAuthor ? `<button onclick="editPost('${esc(post.id)}')" class="w-full text-left px-3.5 py-2 hover:bg-neutral-100 text-neutral-800 flex items-center gap-2"><i class="fa-solid fa-pen w-3.5"></i> এডিট</button>` : ''}
                                    <button onclick="deletePost('${esc(post.id)}')" class="w-full text-left px-3.5 py-2 hover:bg-rose-50 text-rose-600 flex items-center gap-2"><i class="fa-solid fa-trash w-3.5"></i> ডিলিট</button>
                                </div>
                            </div>
                        ` : ''}
                    </div>

                    <div class="text-neutral-800 text-sm leading-relaxed mb-3.5 whitespace-pre-line">
                        <span>${esc(isModal ? post.content : displayText)}</span>
                        ${isLong && !isModal ? `<button onclick="openPostModal('${esc(post.id)}')" class="text-emerald-700 font-bold ml-1 hover:underline focus:outline-none text-xs">বিস্তারিত...</button>` : ''}
                    </div>

                    ${post.image ? `
                        <div class="mb-3.5 rounded-xl overflow-hidden border border-neutral-200 bg-neutral-100 max-h-80 flex items-center justify-center">
                            <img src="${safeUrl(post.image)}" alt="Post image" class="w-full object-cover max-h-80">
                        </div>
                    ` : ''}

                    <div data-react-summary="${esc(post.id)}" class="flex items-center justify-between text-[11px] text-neutral-500 border-b border-neutral-100 pb-2 mb-2.5 min-h-[26px] tabular-nums">
                        <div>
                            ${totalReactions > 0 ? `<span class="font-semibold text-emerald-700">🤲 ${bnNum(totalReactions)}টি প্রতিক্রিয়া</span>` : '<span>প্রতিক্রিয়া নেই</span>'}
                        </div>
                        <div class="space-x-2">
                            ${mCount > 0 ? `<span>মাশাআল্লাহ (${bnNum(mCount)})</span>` : ''}
                            ${dCount > 0 ? `<span>দোয়া রইলো (${bnNum(dCount)})</span>` : ''}
                            ${iCount > 0 ? `<span>ইন্নালিল্লাহ (${bnNum(iCount)})</span>` : ''}
                        </div>
                    </div>

                    <div data-react-bar="${esc(post.id)}" class="grid grid-cols-3 gap-2 border-b border-neutral-100 pb-3 mb-3">
                        <button type="button" onclick="toggleReaction('${esc(post.id)}', 'Masaallah')" class="h-9 px-2 rounded-xl text-xs font-semibold flex items-center justify-center space-x-1 border select-none ${myReaction === 'Masaallah' ? 'bg-emerald-50 text-emerald-800 border-emerald-300' : 'bg-neutral-50 text-neutral-700 border-neutral-200 hover:bg-neutral-100'}">
                            <span>🌿</span> <span>মাশাআল্লাহ</span>
                        </button>
                        <button type="button" onclick="toggleReaction('${esc(post.id)}', 'Dua Roilo')" class="h-9 px-2 rounded-xl text-xs font-semibold flex items-center justify-center space-x-1 border select-none ${myReaction === 'Dua Roilo' ? 'bg-emerald-50 text-emerald-800 border-emerald-300' : 'bg-neutral-50 text-neutral-700 border-neutral-200 hover:bg-neutral-100'}">
                            <span>🤲</span> <span>দোয়া রইলো</span>
                        </button>
                        <button type="button" onclick="toggleReaction('${esc(post.id)}', 'Innalillah')" class="h-9 px-2 rounded-xl text-xs font-semibold flex items-center justify-center space-x-1 border select-none ${myReaction === 'Innalillah' ? 'bg-emerald-50 text-emerald-800 border-emerald-300' : 'bg-neutral-50 text-neutral-700 border-neutral-200 hover:bg-neutral-100'}">
                            <span>🕊️</span> <span>ইন্নালিল্লাহ</span>
                        </button>
                    </div>

                    <div class="space-y-2.5">
                        <form onsubmit="handleComment(event, '${esc(post.id)}')" class="flex space-x-2">
                            <input type="text" id="comment-input-${esc(post.id)}" placeholder="মন্তব্য লিখুন..." class="flex-grow px-3 py-1.5 rounded-xl border border-neutral-200 focus:border-emerald-600 focus:outline-none text-xs">
                            <button type="submit" class="bg-neutral-900 hover:bg-neutral-800 text-white px-3.5 py-1.5 rounded-xl text-xs font-semibold transition">কমেন্ট</button>
                        </form>

                        <div data-comment-list="${esc(post.id)}" class="space-y-1.5 mt-2">
                            ${commentsToShow.map(c => `
                                <div class="bg-neutral-50 px-3 py-2 rounded-xl border border-neutral-100 text-xs flex justify-between items-center">
                                    <div>
                                        <span class="font-bold text-neutral-900 mr-1.5 cursor-pointer hover:text-emerald-700 hover:underline" onclick="viewUserProfile('${esc(c.authorPhone)}')">${esc(c.authorName)}</span>
                                        <span class="text-neutral-700">${esc(c.text)}</span>
                                    </div>
                                    ${(c.authorPhone === state.currentUser.phone || isAuthor || isAdmin) ? `<button onclick="deleteComment('${esc(post.id)}', '${esc(c.id)}')" class="text-neutral-400 hover:text-rose-600 px-1" title="মন্তব্য মুছুন"><i class="fa-solid fa-xmark"></i></button>` : ''}
                                </div>
                            `).join('')}
                        </div>

                        ${!isModal && post.comments.length > 2 ? `
                            <div class="text-center pt-1">
                                <button onclick="openPostModal('${esc(post.id)}')" class="text-emerald-700 font-bold text-xs hover:underline">
                                    সব কমেন্ট দেখুন (${bnNum(post.comments.length)}টি) →
                                </button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // রিঅ্যাকশন দিলে পুরো পেজ রি-রেন্ডার না করে শুধুমাত্র নির্দিষ্ট পোস্টের বার আপডেট (যাতে একটুও না কাঁপে)
        function updatePostReactionsDOM(postId) {
            const post = state.posts.find(p => p.id === postId);
            if (!post) return;
            const mCount = post.reactions['Masaallah']?.length || 0;
            const dCount = post.reactions['Dua Roilo']?.length || 0;
            const iCount = post.reactions['Innalillah']?.length || 0;
            const totalReactions = mCount + dCount + iCount;
            const myReaction = Object.keys(post.reactions).find(key => post.reactions[key].includes(state.currentUser?.phone));

            document.querySelectorAll(`[data-react-summary="${postId}"]`).forEach(el => {
                el.innerHTML = `
                    <div>
                        ${totalReactions > 0 ? `<span class="font-semibold text-emerald-700">🤲 ${bnNum(totalReactions)}টি প্রতিক্রিয়া</span>` : '<span>প্রতিক্রিয়া নেই</span>'}
                    </div>
                    <div class="space-x-2">
                        ${mCount > 0 ? `<span>মাশাআল্লাহ (${bnNum(mCount)})</span>` : ''}
                        ${dCount > 0 ? `<span>দোয়া রইলো (${bnNum(dCount)})</span>` : ''}
                        ${iCount > 0 ? `<span>ইন্নালিল্লাহ (${bnNum(iCount)})</span>` : ''}
                    </div>
                `;
            });

            const activeCls = 'h-9 px-2 rounded-xl text-xs font-semibold flex items-center justify-center space-x-1 border select-none bg-emerald-50 text-emerald-800 border-emerald-300';
            const normalCls = 'h-9 px-2 rounded-xl text-xs font-semibold flex items-center justify-center space-x-1 border select-none bg-neutral-50 text-neutral-700 border-neutral-200 hover:bg-neutral-100';

            document.querySelectorAll(`[data-react-bar="${postId}"]`).forEach(bar => {
                const btns = bar.querySelectorAll('button');
                if (btns[0]) btns[0].className = myReaction === 'Masaallah' ? activeCls : normalCls;
                if (btns[1]) btns[1].className = myReaction === 'Dua Roilo' ? activeCls : normalCls;
                if (btns[2]) btns[2].className = myReaction === 'Innalillah' ? activeCls : normalCls;
            });
        }

        function renderNotifications() {
            const userNotifs = state.notifications.filter(n => n.recipientPhone === state.currentUser.phone);
            return `
                ${renderNavbar()}
                <main class="max-w-2xl mx-auto px-4 py-6 flex-grow w-full">
                    <div class="flex justify-between items-center mb-5">
                        <h2 class="text-xl font-bold text-neutral-900">বিজ্ঞপ্তি</h2>
                        ${userNotifs.length > 0 ? `
                            <button onclick="clearAllNotifications()" class="text-xs bg-neutral-900 text-white px-3 py-1.5 rounded-xl font-semibold hover:bg-neutral-800 transition">সব মুছে ফেলুন</button>
                        ` : ''}
                    </div>

                    <div class="space-y-2.5">
                        ${userNotifs.length === 0 ? '<div class="clean-card p-8 text-center text-neutral-500 text-sm">কোনো বিজ্ঞপ্তি নেই।</div>' : ''}
                        ${userNotifs.map(n => `
                            <div class="p-4 rounded-2xl border ${n.isRead ? 'bg-white border-neutral-200 opacity-80' : 'bg-emerald-50/50 border-emerald-300'} flex justify-between items-center">
                                <div class="flex items-center space-x-3 cursor-pointer flex-grow" onclick="${n.postId ? `markAsReadAndOpen('${esc(n.id)}', '${esc(n.postId)}')` : `markAsRead('${esc(n.id)}')`}">
                                    <div class="w-9 h-9 rounded-full bg-emerald-100 text-emerald-800 flex items-center justify-center flex-shrink-0">
                                        <i class="fa-solid fa-bell text-xs"></i>
                                    </div>
                                    <div>
                                        <p class="text-xs font-medium text-neutral-900">${esc(n.text)}</p>
                                        <span class="text-[10px] text-neutral-400">${timeAgo(n.createdAt, n.date)}</span>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-2 flex-shrink-0 ml-2">
                                    ${!n.isRead ? `<button onclick="markAsRead('${esc(n.id)}')" class="text-[11px] bg-emerald-600 text-white px-2.5 py-1 rounded-lg font-semibold hover:bg-emerald-700 transition">পড়া হয়েছে</button>` : '<span class="text-[10px] text-neutral-400">পঠিত</span>'}
                                    <button onclick="deleteNotification('${esc(n.id)}')" class="text-neutral-400 hover:text-neutral-900 p-1.5" title="মুছে ফেলুন"><i class="fa-solid fa-xmark"></i></button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </main>
            `;
        }

        function renderProfile(targetPhone = null) {
            const user = state.users.find(u => u.phone === (targetPhone || state.currentUser.phone)) || state.currentUser;
            const userPosts = state.posts.filter(p => p.authorPhone === user.phone);
            const isOwnProfile = user.phone === state.currentUser.phone;
            const currentEmail = isOwnProfile ? (auth.currentUser?.email || state.currentUser.email || '') : '';

            return `
                ${renderNavbar()}
                <main class="max-w-2xl mx-auto px-4 py-6 flex-grow w-full space-y-5">
                    <div class="clean-card p-6 text-center relative">
                        <img src="${safeUrl(user.profilePhoto)}" class="w-22 h-22 w-24 h-24 rounded-full mx-auto border-2 border-emerald-600 object-cover mb-3 bg-neutral-100">
                        <h2 class="text-xl font-bold text-neutral-900">${esc(user.name)}</h2>
                        <p class="text-xs text-neutral-500 mt-1">মোবাইল: ${esc(user.phone)}</p>
                        ${isOwnProfile && currentEmail ? `
                            <p class="text-xs text-neutral-700 mt-1 font-medium">
                                ইমেইল: <span class="text-emerald-800 font-semibold">${esc(currentEmail)}</span>
                            </p>
                        ` : ''}
                        <span class="inline-block bg-emerald-50 text-emerald-800 border border-emerald-200 text-xs px-3 py-0.5 rounded-full font-semibold mt-2">${esc(user.profession)}</span>

                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-5 pt-5 border-t border-neutral-100 text-center text-xs">
                            <div class="bg-neutral-50 p-2.5 rounded-xl">
                                <span class="block text-[10px] text-neutral-400 font-semibold">বয়স</span>
                                <span class="font-bold text-neutral-900">${esc(user.age)} বছর</span>
                            </div>
                            <div class="bg-neutral-50 p-2.5 rounded-xl">
                                <span class="block text-[10px] text-neutral-400 font-semibold">ঠিকানা</span>
                                <span class="font-bold text-neutral-900">${esc(user.location)}</span>
                            </div>
                            <div class="bg-neutral-50 p-2.5 rounded-xl">
                                <span class="block text-[10px] text-neutral-400 font-semibold">এসএসসি ব্যাচ</span>
                                <span class="font-bold text-neutral-900">${esc(user.sscBatch)}</span>
                            </div>
                            <div class="bg-neutral-50 p-2.5 rounded-xl">
                                <span class="block text-[10px] text-neutral-400 font-semibold">পোস্ট</span>
                                <span class="font-bold text-neutral-900">${bnNum(userPosts.length)}টি</span>
                            </div>
                        </div>

                        ${isOwnProfile ? `
                            <div class="mt-5 pt-4 border-t border-neutral-100 flex flex-wrap justify-center gap-2">
                                <button onclick="openEditProfileModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition">
                                    <i class="fa-solid fa-pen-to-square mr-1"></i> প্রোফাইল এডিট
                                </button>
                                <button onclick="promptChangeEmail()" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-900 px-3.5 py-2 rounded-xl text-xs font-bold transition border border-emerald-200">
                                    <i class="fa-solid fa-envelope mr-1"></i> ইমেইল পরিবর্তন
                                </button>
                                <button onclick="promptChangePhoto()" class="bg-neutral-100 hover:bg-neutral-200 text-neutral-800 px-3.5 py-2 rounded-xl text-xs font-bold transition">
                                    <i class="fa-solid fa-image mr-1"></i> ছবি পরিবর্তন
                                </button>
                                <button onclick="promptChangePassword()" class="bg-neutral-900 hover:bg-neutral-800 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition">
                                    <i class="fa-solid fa-key mr-1"></i> পাসওয়ার্ড পরিবর্তন
                                </button>
                            </div>
                        ` : ''}

                        ${state.currentUser.isEditor && !isOwnProfile ? `
                            <div class="mt-4 pt-4 border-t border-neutral-100 bg-neutral-100 p-3 rounded-xl text-xs text-neutral-800 flex justify-between items-center">
                                <span><strong>অ্যাডমিন নিয়ন্ত্রণ</strong></span>
                                <button onclick="adminDeleteUser('${esc(user.phone)}')" class="bg-neutral-900 text-white px-3 py-1.5 rounded-lg font-bold hover:bg-rose-600 transition">ইউজার ডিলিট</button>
                            </div>
                        ` : ''}
                    </div>

                    <h3 class="text-base font-bold text-neutral-900">${isOwnProfile ? 'আপনার পোস্টসমূহ' : `${esc(user.name)}-এর পোস্টসমূহ`} (${bnNum(userPosts.length)})</h3>
                    <div class="space-y-4">
                        ${userPosts.length === 0 ? '<p class="text-center text-neutral-500 py-6 clean-card text-sm">কোনো পোস্ট নেই।</p>' : ''}
                        ${userPosts.map(post => renderPostCard(post)).join('')}
                    </div>
                </main>
            `;
        }

        function renderAllMembers() {
            const q = (state.memberQuery || '').trim().toLowerCase();
            const visibleUsers = state.users.filter(u =>
                !q || [u.name, u.location, u.sscBatch, u.profession].join(' ').toLowerCase().includes(q)
            );

            return `
                ${renderNavbar()}
                <main class="max-w-2xl mx-auto px-4 py-6 flex-grow w-full">
                    <h2 class="text-xl font-bold mb-4 text-neutral-900">সকল সদস্য (${bnNum(visibleUsers.length)})</h2>

                    <!-- ফার্স্ট পেজ পপআপ উইন্ডো কন্ট্রোল (ছবিসহ, কোনো বাড়তি লেখা ছাড়া, নির্দিষ্ট সেকেন্ড পর অটো-ভ্যানিশ) -->

                        <form onsubmit="handleSavePopupConfig(event)" class="space-y-3">
                            <div>

                                <input type="url" id="popupImage" value="${esc(pop.image || '')}" placeholder="https://example.com/banner.jpg" class="w-full px-3 py-2 rounded-xl border border-neutral-300 text-sm focus:border-emerald-600 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-neutral-700 mb-1">আপনার লেখা (পপআপে যা দেখাবে)</label>
                                <textarea id="popupText" rows="3" placeholder="পপআপে দেখানোর জন্য আপনার লেখা দিন..." class="w-full p-3 rounded-xl border border-neutral-300 text-sm focus:border-emerald-600 focus:outline-none">${esc(pop.text || '')}</textarea>

                                <input type="number" id="popupDuration" min="3" max="60" value="${esc(pop.duration || 8)}" class="w-32 px-3 py-2 rounded-xl border border-neutral-300 text-sm focus:border-emerald-600 focus:outline-none">

                            <div class="flex items-center justify-between pt-1 flex-wrap gap-2">

                        <form onsubmit="handleEditorBroadcast(event)" class="space-y-3">

                                ${state.users.map(u => `<option value="${esc(u.phone)}">${esc(u.name)} (${esc(u.phone)})</option>`).join('')}

                        </p>
                        <p class="text-xs text-neutral-500">প্রতিটি কার্ড অটো (সোর্স থেকে নিজে আপডেট) বা ম্যানুয়াল (আপনার লেখা) মোডে রাখতে পারবেন। ম্যানুয়াল কার্ড অটো আপডেটে বদলাবে না।</p>
                        ${fixedStories.map((st, i) => {
                            const ls = liveStory(st);
                            const manual = st.mode === 'manual';
                            return `
                            <div class="rounded-xl border ${manual ? 'border-amber-300 bg-amber-50/50' : 'border-neutral-200 bg-neutral-50'} p-3 space-y-2">

                                    <span class="text-xs font-bold text-neutral-900">কার্ড ${bnNum(i + 1)}</span>
                                    <span class="text-[11px] px-2 py-0.5 rounded-full font-bold ${manual ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}">${manual ? 'ম্যানুয়াল' : 'অটো'}</span>
                                </div>
                                <input id="cardTitle_${i}" maxlength="60" value="${esc(ls.title)}" placeholder="কার্ডের শিরোনাম" class="w-full px-3 py-2 rounded-xl border border-neutral-300 text-sm bg-white focus:border-emerald-600 focus:outline-none">
                                <textarea id="cardText_${i}" rows="3" maxlength="800" placeholder="কার্ডের লেখা" class="w-full p-3 rounded-xl border border-neutral-300 text-sm bg-white focus:border-emerald-600 focus:outline-none">${esc(ls.text)}</textarea>
                                <div class="flex items-center justify-between gap-2 flex-wrap">
                                    <select id="cardMode_${i}" class="p-2 rounded-xl border border-neutral-300 text-xs bg-white font-semibold">
                                        <option value="auto" ${manual ? '' : 'selected'}>অটো আপডেট</option>
                                        <option value="manual" ${manual ? 'selected' : ''}>ম্যানুয়াল (আমার লেখা)</option>
                                    </select>
                                    <button onclick="saveStoryCard(${i})" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-1.5 rounded-xl text-xs font-bold">কার্ড সেভ করুন</button>
                                </div>
                            </div>`;

                    </div>

                    <div class="clean-card p-5 space-y-3">
                        <h3 class="font-bold text-neutral-900 text-sm"><i class="fa-solid fa-users text-emerald-600 mr-1"></i> সদস্য তালিকা (${bnNum(shownUsers.length)})</h3>
                        <input id="adminSearch" type="search" value="${esc(state.adminQuery || '')}" oninput="state.adminQuery = this.value; render()" placeholder="নাম বা নম্বর দিয়ে খুঁজুন" class="w-full px-4 py-2.5 rounded-xl border border-neutral-300 text-sm focus:border-emerald-600 focus:outline-none">
                        ${shownUsers.map(u => `
                            <div class="flex items-center justify-between gap-2 p-3 bg-neutral-50 rounded-xl border border-neutral-100">
                                <div class="flex items-center gap-3 min-w-0 cursor-pointer" onclick="viewUserProfile('${esc(u.phone)}')">
                                    <img src="${safeUrl(u.profilePhoto)}" class="w-9 h-9 rounded-full object-cover flex-shrink-0">
                                    <div class="min-w-0">
                                        <p class="font-bold text-sm text-neutral-900 truncate">${esc(u.name)}</p>
                                        <p class="text-[11px] text-neutral-500 truncate">${esc(u.phone)} · ব্যাচ ${esc(u.sscBatch)}</p>
                                    </div>
                                </div>
                                <button onclick="adminDeleteUser('${esc(u.phone)}')" class="text-rose-600 hover:bg-rose-50 px-3 py-1.5 rounded-xl text-xs font-bold border border-rose-200 flex-shrink-0">ডিলিট</button>
                            </div>
